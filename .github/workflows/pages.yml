# Publishes both portfolios on GitHub Pages:
#   https://<owner>.github.io/<repo>/            editor de video
#   https://<owner>.github.io/<repo>/disenador/  diseñador digital y audiovisual
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build both sites with relative URLs
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          NEXT_PUBLIC_RELATIVE_EXPORT=1 NEXT_PUBLIC_SITE_URL="$BASE" NEXT_PUBLIC_OTHER_SITE_URL="$BASE/disenador/" npm run build:editor
          NEXT_PUBLIC_RELATIVE_EXPORT=1 NEXT_PUBLIC_SITE_URL="$BASE/disenador" NEXT_PUBLIC_OTHER_SITE_URL="$BASE/" npm run build:disenador
          node scripts/relative-export.mjs editor
          node scripts/relative-export.mjs disenador
          mkdir -p _site
          cp -a apps/editor/out/. _site/
          cp -a apps/disenador/out _site/disenador
          # GitHub serves the root 404.html for any missing path, so pin its relative URLs to the site root.
          sed -i "s#<head>#<head><base href=\"$BASE/\">#" _site/404.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
