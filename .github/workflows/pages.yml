# Publishes the portfolio and LIFE OS on GitHub Pages:
#   https://<owner>.github.io/<repo>/disenador/  portafolio (editor de video y diseñador digital)
#   https://<owner>.github.io/<repo>/            redirige al portafolio
#   https://<owner>.github.io/<repo>/life-os/    LIFE OS (app personal; los datos viven en el navegador de cada dispositivo)
#   https://<owner>.github.io/<repo>/regalo/     página-regalo (sitio estático de apps/regalo)
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the sites
        env:
          BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          NEXT_PUBLIC_RELATIVE_EXPORT=1 NEXT_PUBLIC_SITE_URL="$BASE/disenador" npm run build:disenador
          node scripts/relative-export.mjs disenador
          mkdir -p _site
          cp -a apps/disenador/out _site/disenador
          # The root used to hold the video editor site: send it, and its old project pages, to the portfolio.
          node scripts/root-redirect.mjs _site "$BASE"
          # LIFE OS uses a real base path (its service worker and manifest need absolute, stable URLs).
          NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}/life-os" npm run build:life-os
          cp -a apps/life-os/out _site/life-os
          # The gift page is plain static files: publish the folder as it is.
          cp -a apps/regalo _site/regalo
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
