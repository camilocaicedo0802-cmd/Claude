<script>
async function fit(id, capTop, capH, left, right){
  await document.fonts.ready;
  const el=document.getElementById(id);
  // scale font so measured cap height (approx via 'H' box) matches capH, and width matches
  const fs=parseFloat(getComputedStyle(el).fontSize);
  const capRatio=0.727; // Inter cap height / em
  const size=capH/capRatio; el.style.fontSize=size+'px';
  const r=el.getBoundingClientRect();
  el.style.left=left+'px';
  // top: line box top + (ascent - cap) ; approximate using metrics
  el.style.top=(capTop - size*(0.969-0.727) - (size*1 - size*(0.969+0.242))/2)+'px';
  return [id,size.toFixed(1),r.width.toFixed(0),(right-left)];
}
window.go=async()=>[await fit('a',510,145,80,1000),await fit('b',740,240,160,925),await fit('c',690,42,160,372),await fit('d',1215,40,0,0)];
</script></body></html>
